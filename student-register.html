<!DOCTYPE html>
<html>

<head>
    <title>Capacity Connect - Student Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .register-box {
            width: 650px;
            margin: 40px auto;
            background: white;
            padding: 40px 45px;
            border-radius: 15px;
            box-shadow: 0 4px 18px #ccc;
        }

        h1 {
            text-align: center;
            color: #4b45d8;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 17px;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d2d2d2;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            height: 80px;
            resize: none;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .field {
            width: 50%;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #4b45d8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #3731b8;
        }

        .terms {
            margin-top: 20px;
            font-size: 14px;
        }

        .terms input {
            width: auto;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #4b45d8;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

        @media screen and (max-width: 650px) {
            .register-box {
                width: 90%;
                padding: 30px 25px;
            }

            .row {
                display: block;
            }

            .field {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="register-box">

    <h1>Capacity Connect</h1>

    <div class="subtitle">
        Student / Learner Registration 🎓
    </div>

    <label>Full Name</label>
    <input type="text" id="name" placeholder="Enter your full name">

    <label>Student ID</label>
    <input type="text" id="userId" placeholder="Enter your student ID">

    <label>Email Address</label>
    <input type="email" id="email" placeholder="Enter your email">

    <label>Mobile Number</label>
    <input type="tel" id="phone" placeholder="Enter your mobile number">

    <div class="row">

        <div class="field">
            <label>Gender</label>

            <select id="gender">
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
                <option>Prefer not to say</option>
            </select>
        </div>

        <div class="field">
            <label>Date of Birth</label>

            <input type="date" id="dob">
        </div>

    </div>

    <label>Mother Tongue</label>

    <select id="motherTongue">

        <option value="">Select your language</option>

        <option>Telugu</option>
        <option>English</option>
        <option>Hindi</option>
        <option>Tamil</option>
        <option>Kannada</option>
        <option>Malayalam</option>
        <option>Other</option>

    </select>

    <label>Preferred Learning Language</label>

    <select id="learningLanguage">

        <option value="">Select learning language</option>

        <option>English</option>
        <option>Telugu</option>
        <option>Hindi</option>
        <option>Tamil</option>
        <option>Kannada</option>
        <option>Malayalam</option>
        <option>Other</option>

    </select>

    <label>Education Level</label>

    <select id="education">

        <option value="">Select education</option>

        <option>10th Standard</option>
        <option>Intermediate</option>
        <option>Diploma</option>
        <option>Undergraduate</option>
        <option>Postgraduate</option>

    </select>

    <label>Course / Specialization</label>

    <select id="course">

        <option value="">Select your course</option>

        <option>Computer Science</option>
        <option>Information Technology</option>
        <option>Artificial Intelligence</option>
        <option>Data Science</option>
        <option>Electronics</option>
        <option>Mechanical Engineering</option>
        <option>Civil Engineering</option>
        <option>Other</option>

    </select>

    <label>Skills</label>

    <textarea
        id="skills"
        placeholder="Example: Java, Python, HTML, Communication..."></textarea>

    <label>Location</label>

    <select id="city">

        <option value="">Select your location</option>

        <option>Visakhapatnam</option>
        <option>Vizianagaram</option>
        <option>Vijayawada</option>
        <option>Hyderabad</option>
        <option>Anantapur</option>
        <option>Tirupati</option>
        <option>Kurnool</option>
        <option>Nellore</option>
        <option>Guntur</option>
        <option>Kadapa</option>
        <option>Srikakulam</option>
        <option>Rajahmundry</option>
        <option>Ongole</option>
        <option>Chittoor</option>
        <option>Eluru</option>
        <option>Bhimavaram</option>
        <option>Machilipatnam</option>
        <option>Other</option>

    </select>

    <label>Create Password</label>

    <input
        type="password"
        id="password"
        placeholder="Create a password">

    <label>Confirm Password</label>

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password">

    <div class="terms">

        <input type="checkbox" id="terms">

        I agree to the Terms & Conditions and Privacy Policy.

    </div>

    <button
        class="register-btn"
        onclick="registerStudent()">

        Create Student Account

    </button>

    <a
        class="back"
        href="index.html">

        ← Back to Home

    </a>

</div>

<script>

async function registerStudent() {

    let name =
        document.getElementById("name").value.trim();

    let userId =
        document.getElementById("userId").value.trim();

    let email =
        document.getElementById("email").value.trim();

    let phone =
        document.getElementById("phone").value.trim();

    let gender =
        document.getElementById("gender").value;

    let dob =
        document.getElementById("dob").value;

    let motherTongue =
        document.getElementById("motherTongue").value;

    let learningLanguage =
        document.getElementById("learningLanguage").value;

    let education =
        document.getElementById("education").value;

    let course =
        document.getElementById("course").value;

    let skills =
        document.getElementById("skills").value.trim();

    let city =
        document.getElementById("city").value;

    let password =
        document.getElementById("password").value;

    let confirmPassword =
        document.getElementById("confirmPassword").value;

    let terms =
        document.getElementById("terms").checked;


    /* VALIDATION */

    if (
        name === "" ||
        userId === "" ||
        email === "" ||
        phone === "" ||
        gender === "" ||
        dob === "" ||
        motherTongue === "" ||
        learningLanguage === "" ||
        education === "" ||
        course === "" ||
        skills === "" ||
        city === "" ||
        password === "" ||
        confirmPassword === ""
    ) {

        alert("Please fill all details");

        return;
    }


    /* PASSWORD CHECK */

    if (password !== confirmPassword) {

        alert("Passwords do not match");

        return;
    }


    /* TERMS CHECK */

    if (!terms) {

        alert("Please accept Terms & Conditions");

        return;
    }


    try {

        /* SEND STUDENT TO SPRING BOOT + MYSQL */

        let response = await fetch(
            "http://localhost:8081/api/auth/register",
            {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    name: name,

                    email: email,

                    password: password,

                    role: "Learner"

                })

            }
        );


        if (!response.ok) {

            alert(
                "Registration failed. Email may already be registered."
            );

            return;
        }


        let savedUser =
            await response.json();


        /* SAVE REGISTERED STUDENTS */

        let students =
            JSON.parse(
                localStorage.getItem("registeredStudents")
            ) || [];


        let student = {

            name: name,

            userId: userId,

            email: email,

            phone: phone,

            course: course

        };


        students.push(student);


        localStorage.setItem(
            "registeredStudents",
            JSON.stringify(students)
        );


        /* SAVE CURRENT USER DETAILS */

        localStorage.setItem(
            "userRole",
            "Learner"
        );

        localStorage.setItem(
            "userName",
            name
        );

        localStorage.setItem(
            "userId",
            userId
        );

        localStorage.setItem(
            "userEmail",
            email
        );

        localStorage.setItem(
            "userPassword",
            password
        );

        localStorage.setItem(
            "userPhone",
            phone
        );

        localStorage.setItem(
            "userGender",
            gender
        );

        localStorage.setItem(
            "userDOB",
            dob
        );

        localStorage.setItem(
            "userMotherTongue",
            motherTongue
        );

        localStorage.setItem(
            "userLearningLanguage",
            learningLanguage
        );

        localStorage.setItem(
            "userEducation",
            education
        );

        localStorage.setItem(
            "userCourse",
            course
        );

        localStorage.setItem(
            "userSkills",
            skills
        );

        localStorage.setItem(
            "userCity",
            city
        );


        alert(
            "Student Registration Successful! 🎉"
        );


        window.location.href =
            "login.html";

    }

    catch (error) {

        console.error(error);

        alert(
            "Cannot connect to backend. Please make sure Spring Boot is running."
        );

    }

}

</script>

</body>

</html>
