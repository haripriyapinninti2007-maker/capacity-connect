<!DOCTYPE html>
<html>
<head>
<title>Java Module 7 Quiz</title>
<style>
body{font-family:Arial;background:#f4f7fb;margin:0}
header{background:#173b7a;color:white;padding:20px 50px}
.container{width:80%;margin:40px auto}
.question{background:white;padding:20px;margin:20px 0;border-radius:10px;box-shadow:0 3px 12px #ddd}
button{background:#173b7a;color:white;border:0;padding:12px 25px;border-radius:5px}
label{display:block;margin:12px}
#result{margin-top:20px;font-size:20px;font-weight:bold}
</style>
</head>
<body>

<header><h2>CAPACITY CONNECT</h2></header>

<div class="container">
<h1>📝 Module 7 Quiz — Inheritance & Polymorphism</h1>

<div class="question">
<h3>1. Which keyword is used for inheritance?</h3>
<label><input type="radio" name="q1" value="a"> extends</label>
<label><input type="radio" name="q1" value="b"> inherit</label>
<label><input type="radio" name="q1" value="c"> superClass</label>
</div>

<div class="question">
<h3>2. Inheritance allows a class to acquire ______.</h3>
<label><input type="radio" name="q2" value="a"> Properties and methods</label>
<label><input type="radio" name="q2" value="b"> Only variables</label>
<label><input type="radio" name="q2" value="c"> Only loops</label>
</div>

<div class="question">
<h3>3. Polymorphism means ______.</h3>
<label><input type="radio" name="q3" value="a"> Many forms</label>
<label><input type="radio" name="q3" value="b"> One class</label>
<label><input type="radio" name="q3" value="c"> One variable</label>
</div>

<div class="question">
<h3>4. Redefining a parent class method in child class is called?</h3>
<label><input type="radio" name="q4" value="a"> Method overriding</label>
<label><input type="radio" name="q4" value="b"> Method deleting</label>
<label><input type="radio" name="q4" value="c"> Method hiding</label>
</div>

<div class="question">
<h3>5. Which class is called the child class?</h3>
<label><input type="radio" name="q5" value="a"> Subclass</label>
<label><input type="radio" name="q5" value="b"> Parent class</label>
<label><input type="radio" name="q5" value="c"> Main class</label>
</div>

<button onclick="checkQuiz()">Submit Quiz</button>
<div id="result"></div>
</div>

<script>
function checkQuiz(){
let score=0;
if(document.querySelector('input[name="q1"]:checked')?.value==="a")score++;
if(document.querySelector('input[name="q2"]:checked')?.value==="a")score++;
if(document.querySelector('input[name="q3"]:checked')?.value==="a")score++;
if(document.querySelector('input[name="q4"]:checked')?.value==="a")score++;
if(document.querySelector('input[name="q5"]:checked')?.value==="a")score++;

localStorage.setItem("javaModule7Score",score);
localStorage.setItem("javaModule7Completed","true");

document.getElementById("result").innerHTML=
"🎉 Your Score: "+score+" / 5<br>✅ Module 7 Completed!";
}
</script>

</body>
</html>
