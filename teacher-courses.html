<!DOCTYPE html>
<html>
<head>
    <title>Teacher Courses</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        header {
            background: #173b7a;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        .back {
            color: white;
            text-decoration: none;
        }

        .container {
            padding: 40px 60px;
        }

        .box {
            background: white;
            padding: 30px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #ddd;
        }

        h1, h2, h3 {
            color: #173b7a;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            background: #173b7a;
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0f2d60;
        }

        .course {
            background: #eef3ff;
            padding: 20px;
            margin-top: 15px;
            border-radius: 8px;
        }

        .course button {
            margin-right: 8px;
        }

        .delete {
            background: #b3261e;
        }
    </style>
</head>

<body>

<header>

    <h2>CAPACITY CONNECT</h2>

    <a href="teacher-dashboard.html" class="back">
        ← Back to Dashboard
    </a>

</header>


<div class="container">

    <h1>📚 My Courses</h1>

    <p>
        Create and manage courses for your students.
    </p>


    <!-- Add Course -->

    <div class="box">

        <h2>➕ Add New Course</h2>

        <label>Course Name</label>

        <input
            type="text"
            id="courseName"
            placeholder="Enter course name"
        >

        <label>Course Description</label>

        <textarea
            id="courseDescription"
            placeholder="Enter course description">
        </textarea>

        <label>Course Level</label>

        <select id="courseLevel">

            <option value="">-- Select Level --</option>

            <option value="Beginner">Beginner</option>

            <option value="Intermediate">Intermediate</option>

            <option value="Advanced">Advanced</option>

        </select>

        <button onclick="addCourse()">
            Add Course
        </button>

    </div>


    <!-- Course List -->

    <div class="box">

        <h2>📖 Course List</h2>

        <div id="courseList"></div>

    </div>

</div>

<script>

async function loadCourses() {

    try {

        let response = await fetch("http://localhost:8081/api/courses");

        if (!response.ok) {
            throw new Error("Failed to load courses");
        }

        let courses = await response.json();

        let courseList = document.getElementById("courseList");

        courseList.innerHTML = "";

        if (courses.length === 0) {
            courseList.innerHTML = "<p>No courses added yet.</p>";
            return;
        }

        courses.forEach(function(course) {

            let courseDiv = document.createElement("div");

            courseDiv.className = "course";

            courseDiv.innerHTML =
                "<h3>" + course.name + "</h3>" +
                "<p>" + course.description + "</p>" +
                "<p><strong>Level:</strong> " +
                course.level +
                "</p>" +
                "<button class='delete' onclick='deleteCourse(" +
                course.id +
                ")'>Delete</button>";

            courseList.appendChild(courseDiv);

        });

    } catch (error) {

        console.error(error);

        alert("Cannot connect to backend. Please make sure Spring Boot is running.");
    }
}


async function addCourse() {

    let name =
        document.getElementById("courseName").value.trim();

    let description =
        document.getElementById("courseDescription").value.trim();

    let level =
        document.getElementById("courseLevel").value;

    if (name === "") {
        alert("Please enter course name.");
        return;
    }

    if (description === "") {
        alert("Please enter course description.");
        return;
    }

    if (level === "") {
        alert("Please select course level.");
        return;
    }

    let teacherName =
        localStorage.getItem("userName") || "Teacher";

    try {

        let response = await fetch(
            "http://localhost:8081/api/courses",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    description: description,
                    level: level,
                    teacherName: teacherName
                })
            }
        );

        if (!response.ok) {
            throw new Error("Course creation failed");
        }

        alert("Course added successfully! 🎉");

        document.getElementById("courseName").value = "";
        document.getElementById("courseDescription").value = "";
        document.getElementById("courseLevel").value = "";

        loadCourses();

    } catch (error) {

        console.error(error);

        alert("Cannot connect to backend. Please make sure Spring Boot is running.");
    }
}


async function deleteCourse(id) {

    if (!confirm("Are you sure you want to delete this course?")) {
        return;
    }

    try {

        let response = await fetch(
            "http://localhost:8081/api/courses/" + id,
            {
                method: "DELETE"
            }
        );

        if (!response.ok) {
            throw new Error("Delete failed");
        }

        alert("Course deleted successfully.");

        loadCourses();

    } catch (error) {

        console.error(error);

        alert("Cannot delete course.");
    }
}


loadCourses();

</script>


</body>
</html>
