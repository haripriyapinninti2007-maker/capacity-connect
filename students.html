<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacity Connect - Students</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
        }

        .header {
            background: #2563eb;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .back-btn {
            background: white;
            color: #2563eb;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            padding: 30px 40px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            margin: 0 0 10px;
            color: #666;
            font-size: 15px;
        }

        .stat-card p {
            margin: 0;
            font-size: 30px;
            font-weight: bold;
            color: #2563eb;
        }

        .students-box {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top-row h2 {
            margin: 0;
        }

        .search-box {
            padding: 10px 14px;
            width: 280px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f1f5f9;
            text-align: left;
            padding: 14px;
            font-size: 14px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f8fafc;
        }

        .status {
            background: #dcfce7;
            color: #15803d;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .view-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .view-btn:hover {
            background: #1d4ed8;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        .error {
            text-align: center;
            padding: 30px;
            color: red;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .top-row {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            .search-box {
                width: 100%;
            }

            .students-box {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Capacity Connect - Students</h1>

        <button class="back-btn" onclick="goBack()">
            ← Back to Dashboard
        </button>
    </div>

    <div class="container">

        <div class="stats">

            <div class="stat-card">
                <h3>Total Students</h3>
                <p id="totalStudents">0</p>
            </div>

            <div class="stat-card">
                <h3>Active Students</h3>
                <p id="activeStudents">0</p>
            </div>

            <div class="stat-card">
                <h3>Learning Role</h3>
                <p>Learner</p>
            </div>

        </div>

        <div class="students-box">

            <div class="top-row">
                <h2>Students</h2>

                <input
                    type="text"
                    id="searchInput"
                    class="search-box"
                    placeholder="Search students..."
                    onkeyup="searchStudents()"
                >
            </div>

            <div id="tableContainer">
                <div class="loading">
                    Loading students...
                </div>
            </div>

        </div>

    </div>

    <script>

        const API_URL = "http://localhost:8081/api/users/students";

        let students = [];

        // Load students from backend
        async function loadStudents() {

            try {

                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error("Failed to load students");
                }

                students = await response.json();

                document.getElementById("totalStudents").textContent =
                    students.length;

                document.getElementById("activeStudents").textContent =
                    students.length;

                displayStudents(students);

            } catch (error) {

                console.error(error);

                document.getElementById("tableContainer").innerHTML = `
                    <div class="error">
                        Cannot connect to backend.
                        <br><br>
                        Please make sure Spring Boot is running on port 8081.
                    </div>
                `;
            }
        }


        // Display students
        function displayStudents(studentList) {

            if (studentList.length === 0) {

                document.getElementById("tableContainer").innerHTML = `
                    <div class="loading">
                        No students found.
                    </div>
                `;

                return;
            }

            let html = `
                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody>
            `;

            studentList.forEach(student => {

                html += `
                    <tr>

                        <td>${student.id}</td>

                        <td>
                            <strong>${student.name}</strong>
                        </td>

                        <td>${student.email}</td>

                        <td>${student.role}</td>

                        <td>
                            <span class="status">
                                Active
                            </span>
                        </td>

                        <td>
                            <button
                                class="view-btn"
                                onclick="viewStudent(${student.id})">
                                View
                            </button>
                        </td>

                    </tr>
                `;

            });

            html += `
                    </tbody>
                </table>
            `;

            document.getElementById("tableContainer").innerHTML = html;
        }


        // Search students
        function searchStudents() {

            const search =
                document
                    .getElementById("searchInput")
                    .value
                    .toLowerCase();

            const filteredStudents = students.filter(student =>

                student.name.toLowerCase().includes(search) ||

                student.email.toLowerCase().includes(search)

            );

            displayStudents(filteredStudents);
        }


        // View student
        function viewStudent(id) {

            const student =
                students.find(s => s.id === id);

            if (!student) {
                return;
            }

            alert(
                "Student Details\n\n" +
                "ID: " + student.id + "\n" +
                "Name: " + student.name + "\n" +
                "Email: " + student.email + "\n" +
                "Role: " + student.role
            );
        }


        // Back to teacher dashboard
        function goBack() {

            window.location.href = "teacher-dashboard.html";
        }


        // Start
        loadStudents();

    </script>

</body>
</html>
