<!DOCTYPE html>
<html>
<head>
<title>Java Module 5 Quiz</title>
<style>
body{font-family:Arial;background:#f4f7fb;margin:0}
header{background:#173b7a;color:white;padding:20px 50px}
.container{width:80%;margin:40px auto}
.question{background:white;padding:20px;margin:20px 0;border-radius:10px;box-shadow:0 3px 12px #ddd}
button{background:#173b7a;color:white;border:0;padding:12px 25px;border-radius:5px}
label{display:block;margin:12px}
#result{margin-top:20px;font-size:20px;font-weight:bold}
</style>
</head>
<body>

<header><h2>CAPACITY CONNECT</h2></header>

<div class="container">
<h1>📝 Module 5 Quiz — Strings</h1>

<div class="question">
<h3>1. Which data type is used for Strings?</h3>
<label><input type="radio" name="q1" value="a"> String</label>
<label><input type="radio" name="q1" value="b"> int</label>
<label><input type="radio" name="q1" value="c"> float</label>
</div>

<div class="question">
<h3>2. Which method returns String length?</h3>
<label><input type="radio" name="q2" value="a"> size()</label>
<label><input type="radio" name="q2" value="b"> length()</label>
<label><input type="radio" name="q2" value="c"> count()</label>
</div>

<div class="question">
<h3>3. Which method converts String to uppercase?</h3>
<label><input type="radio" name="q3" value="a"> upper()</label>
<label><input type="radio" name="q3" value="b"> toUpperCase()</label>
<label><input type="radio" name="q3" value="c"> uppercase()</label>
</div>

<div class="question">
<h3>4. Which method compares two Strings?</h3>
<label><input type="radio" name="q4" value="a"> equals()</label>
<label><input type="radio" name="q4" value="b"> compare()</label>
<label><input type="radio" name="q4" value="c"> same()</label>
</div>

<div class="question">
<h3>5. Which method returns a character at an index?</h3>
<label><input type="radio" name="q5" value="a"> charAt()</label>
<label><input type="radio" name="q5" value="b"> character()</label>
<label><input type="radio" name="q5" value="c"> getChar()</label>
</div>

<button onclick="checkQuiz()">Submit Quiz</button>
<div id="result"></div>
</div>

<script>
function checkQuiz(){
let score=0;
if(document.querySelector('input[name="q1"]:checked')?.value==="a")score++;
if(document.querySelector('input[name="q2"]:checked')?.value==="b")score++;
if(document.querySelector('input[name="q3"]:checked')?.value==="b")score++;
if(document.querySelector('input[name="q4"]:checked')?.value==="a")score++;
if(document.querySelector('input[name="q5"]:checked')?.value==="a")score++;

localStorage.setItem("javaModule5Score",score);
localStorage.setItem("javaModule5Completed","true");

document.getElementById("result").innerHTML=
"🎉 Your Score: "+score+" / 5<br>✅ Module 5 Completed!";
}
</script>

</body>
</html>
