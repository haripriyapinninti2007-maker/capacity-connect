<!DOCTYPE html>
<html>
<head>
<title>Java Module 4 Quiz</title>
<style>
body{font-family:Arial;background:#f4f7fb;margin:0}
header{background:#173b7a;color:white;padding:20px 50px}
.container{width:80%;margin:40px auto}
.question{background:white;padding:20px;margin:20px 0;border-radius:10px;box-shadow:0 3px 12px #ddd}
button{background:#173b7a;color:white;border:0;padding:12px 25px;border-radius:5px}
label{display:block;margin:12px}
#result{margin-top:20px;font-size:20px;font-weight:bold}
</style>
</head>
<body>

<header><h2>CAPACITY CONNECT</h2></header>

<div class="container">
<h1>📝 Module 4 Quiz — Arrays</h1>

<div class="question">
<h3>1. Array indexing starts from?</h3>
<label><input type="radio" name="q1" value="a"> 0</label>
<label><input type="radio" name="q1" value="b"> 1</label>
<label><input type="radio" name="q1" value="c"> -1</label>
<label><input type="radio" name="q1" value="d"> 2</label>
</div>

<div class="question">
<h3>2. Which property gives the size of an array?</h3>
<label><input type="radio" name="q2" value="a"> size()</label>
<label><input type="radio" name="q2" value="b"> length</label>
<label><input type="radio" name="q2" value="c"> count()</label>
<label><input type="radio" name="q2" value="d"> length()</label>
</div>

<div class="question">
<h3>3. Which is a correct integer array declaration?</h3>
<label><input type="radio" name="q3" value="a"> int[] a;</label>
<label><input type="radio" name="q3" value="b"> array int a;</label>
<label><input type="radio" name="q3" value="c"> int a[] only;</label>
<label><input type="radio" name="q3" value="d"> integer[] a;</label>
</div>

<div class="question">
<h3>4. Which loop can be used to traverse an array?</h3>
<label><input type="radio" name="q4" value="a"> for</label>
<label><input type="radio" name="q4" value="b"> if</label>
<label><input type="radio" name="q4" value="c"> switch</label>
<label><input type="radio" name="q4" value="d"> class</label>
</div>

<div class="question">
<h3>5. What type of elements can a Java array store?</h3>
<label><input type="radio" name="q5" value="a"> Same data type</label>
<label><input type="radio" name="q5" value="b"> Only String</label>
<label><input type="radio" name="q5" value="c"> Only int</label>
<label><input type="radio" name="q5" value="d"> Any unrelated types</label>
</div>

<button onclick="checkQuiz()">Submit Quiz</button>
<div id="result"></div>
</div>

<script>
function checkQuiz(){
let score=0;
if(document.querySelector('input[name="q1"]:checked')?.value==="a")score++;
if(document.querySelector('input[name="q2"]:checked')?.value==="b")score++;
if(document.querySelector('input[name="q3"]:checked')?.value==="a")score++;
if(document.querySelector('input[name="q4"]:checked')?.value==="a")score++;
if(document.querySelector('input[name="q5"]:checked')?.value==="a")score++;

localStorage.setItem("javaModule4Score",score);
localStorage.setItem("javaModule4Completed","true");

document.getElementById("result").innerHTML=
"🎉 Your Score: "+score+" / 5<br>✅ Module 4 Completed!";
}
</script>

</body>
</html>
