<!DOCTYPE html>
<html>
<head>
<title>Java Module 6 Quiz</title>
<style>
body{font-family:Arial;background:#f4f7fb;margin:0}
header{background:#173b7a;color:white;padding:20px 50px}
.container{width:80%;margin:40px auto}
.question{background:white;padding:20px;margin:20px 0;border-radius:10px;box-shadow:0 3px 12px #ddd}
button{background:#173b7a;color:white;border:0;padding:12px 25px;border-radius:5px}
label{display:block;margin:12px}
#result{margin-top:20px;font-size:20px;font-weight:bold}
</style>
</head>
<body>

<header><h2>CAPACITY CONNECT</h2></header>

<div class="container">
<h1>📝 Module 6 Quiz — Classes & Objects</h1>

<div class="question">
<h3>1. A class is a ______.</h3>
<label><input type="radio" name="q1" value="a"> Blueprint</label>
<label><input type="radio" name="q1" value="b"> Loop</label>
<label><input type="radio" name="q1" value="c"> Operator</label>
</div>

<div class="question">
<h3>2. An object is an instance of a ______.</h3>
<label><input type="radio" name="q2" value="a"> Loop</label>
<label><input type="radio" name="q2" value="b"> Class</label>
<label><input type="radio" name="q2" value="c"> Method</label>
</div>

<div class="question">
<h3>3. Which keyword creates an object?</h3>
<label><input type="radio" name="q3" value="a"> create</label>
<label><input type="radio" name="q3" value="b"> new</label>
<label><input type="radio" name="q3" value="c"> object</label>
</div>

<div class="question">
<h3>4. What is used to perform a particular task?</h3>
<label><input type="radio" name="q4" value="a"> Method</label>
<label><input type="radio" name="q4" value="b"> Package</label>
<label><input type="radio" name="q4" value="c"> Import</label>
</div>

<div class="question">
<h3>5. Which keyword defines a class?</h3>
<label><input type="radio" name="q5" value="a"> class</label>
<label><input type="radio" name="q5" value="b"> object</label>
<label><input type="radio" name="q5" value="c"> define</label>
</div>

<button onclick="checkQuiz()">Submit Quiz</button>
<div id="result"></div>
</div>

<script>
function checkQuiz(){
let score=0;
if(document.querySelector('input[name="q1"]:checked')?.value==="a")score++;
if(document.querySelector('input[name="q2"]:checked')?.value==="b")score++;
if(document.querySelector('input[name="q3"]:checked')?.value==="b")score++;
if(document.querySelector('input[name="q4"]:checked')?.value==="a")score++;
if(document.querySelector('input[name="q5"]:checked')?.value==="a")score++;

localStorage.setItem("javaModule6Score",score);
localStorage.setItem("javaModule6Completed","true");

document.getElementById("result").innerHTML=
"🎉 Your Score: "+score+" / 5<br>✅ Module 6 Completed!";
}
</script>

</body>
</html>
